x-common-volumes: &common-volumes
  - ./:/MoneyPrinterTurbo
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD_MIRROR: china
        PIP_USE_OFFICIAL: "1"
    container_name: "moneyprinterturbo-webui"
    command: [ "sh", "-c", "python3 -c \"import toml,os,shutil; shutil.copyfile('config.example.toml','config.toml') if not os.path.exists('config.toml') else None; c=toml.load(open('config.toml')); c['app']['pexels_api_keys']=[os.environ.get('PEXELS_API_KEY','')]; c['app']['video_source']='pexels'; toml.dump(c, open('config.toml','w'))\" && exec streamlit run ./webui/Main.py --server.address=0.0.0.0 --server.port=8501 --browser.serverAddress=127.0.0.1 --server.enableCORS=True --browser.gatherUsageStats=False --client.toolbarMode=minimal --logger.hideWelcomeMessage=True --server.showEmailPrompt=False" ]
    volumes: *common-volumes
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.moneyprinterturbo-webui-http.entryPoints=http
      - traefik.http.routers.moneyprinterturbo-webui-http.middlewares=redirect-to-https
      - "traefik.http.routers.moneyprinterturbo-webui-http.rule=Host(`moneyprinter.lab.nerdistan.com.ar`) && PathPrefix(`/`)"
      - traefik.http.routers.moneyprinterturbo-webui-http.service=moneyprinterturbo-webui-http
      - traefik.http.routers.moneyprinterturbo-webui-https.entryPoints=https
      - traefik.http.routers.moneyprinterturbo-webui-https.middlewares=gzip
      - "traefik.http.routers.moneyprinterturbo-webui-https.rule=Host(`moneyprinter.lab.nerdistan.com.ar`) && PathPrefix(`/`)"
      - traefik.http.routers.moneyprinterturbo-webui-https.service=moneyprinterturbo-webui-https
      - traefik.http.routers.moneyprinterturbo-webui-https.tls.certresolver=letsencrypt
      - traefik.http.routers.moneyprinterturbo-webui-https.tls=true
      - traefik.http.services.moneyprinterturbo-webui-http.loadbalancer.server.port=8501
      - traefik.http.services.moneyprinterturbo-webui-https.loadbalancer.server.port=8501
      - caddy_0.encode=zstd gzip
      - "caddy_0.handle_path.0_reverse_proxy={{upstreams 8501}}"
      - caddy_0.handle_path=/*
      - caddy_0.header=-Server
      - caddy_0=https://moneyprinter.lab.nerdistan.com.ar
      - caddy_ingress_network=coolify
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD_MIRROR: china
        PIP_USE_OFFICIAL: "1"
    container_name: "moneyprinterturbo-api"
    command: [ "sh", "-c", "python3 -c \"import toml,os,shutil; shutil.copyfile('config.example.toml','config.toml') if not os.path.exists('config.toml') else None; c=toml.load(open('config.toml')); c['app']['pexels_api_keys']=[os.environ.get('PEXELS_API_KEY','')]; c['app']['video_source']='pexels'; toml.dump(c, open('config.toml','w'))\" && exec python3 main.py" ]
    volumes: *common-volumes
    restart: always
